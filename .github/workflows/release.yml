name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - name: Check tag matches package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "$tag" = "$ver" || { echo "tag v$tag != pyproject version $ver"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Create GitHub release with artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "openclips $GITHUB_REF_NAME" \
            --notes-file <(awk -v tag="${GITHUB_REF_NAME#v}" '
              $0 ~ "^## \\[" tag "\\]" {p=1; next}
              p && /^## \[/ {exit}
              p' CHANGELOG.md)
